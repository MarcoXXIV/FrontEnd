<div class="navbar-shell">
  <div class="toast-notification" [class.active]="showToast" [ngClass]="toastType">
    <div class="toast-content">
      <i
        class="fas"
        [ngClass]="toastType === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'">
      </i>
      <span>{{ toastMsg }}</span>
    </div>
    <div class="toast-progress" [class.running]="showToast"></div>
  </div>

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <ng-container *ngIf="!isEmptyNavbar(); else leftEmptyState">
          <div class="desktop-toolbar desktop-toolbar-left">
            <button
              *ngFor="let action of getDesktopLeftActions(); trackBy: trackByActionId"
              type="button"
              class="icon-pill"
              [class.active]="action.active"
              [class.accent]="action.variant === 'accent'"
              [class.danger]="action.variant === 'danger'"
              [attr.data-label]="action.label"
              [attr.aria-label]="action.label"
              (click)="handleAction(action.id)"
            >
              <span class="icon-pill-emoji">{{ action.icon }}</span>
            </button>
          </div>
        </ng-container>

        <ng-template #leftEmptyState>
          <div class="desktop-spacer"></div>
        </ng-template>
      </div>

      <a
        routerLink="/Home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="brand brand-center"
        title="Torna alla Home"
      >
        <img
          src="assets/img/SPECBATTLE.png"
          alt="SpecBattle - Logo"
          class="brand-logo"
        />

        <div class="brand-copy">
          <span class="brand-title">SPEC<span>BATTLE</span></span>
          <span class="brand-subtitle">compare • race • choose</span>
        </div>
      </a>

      <div class="nav-right">
        <ng-container *ngIf="!isEmptyNavbar(); else rightEmptyState">
          <div class="nav-auth" *ngIf="!loggedIn; else loggedToolbar">
            <div class="desktop-toolbar desktop-toolbar-right">
              <button
                *ngFor="let action of getDesktopRightActions(); trackBy: trackByActionId"
                type="button"
                class="icon-pill"
                [class.active]="action.active"
                [class.accent]="action.variant === 'accent'"
                [class.danger]="action.variant === 'danger'"
                [attr.data-label]="action.label"
                [attr.aria-label]="action.label"
                (click)="handleAction(action.id)"
              >
                <span class="icon-pill-emoji">{{ action.icon }}</span>
              </button>

              <button type="button" class="btn-login" (click)="vaiLogin()">Accedi</button>
            </div>
          </div>

          <ng-template #loggedToolbar>
            <div class="desktop-toolbar desktop-toolbar-right">
              <button
                *ngFor="let action of getDesktopRightActions(); trackBy: trackByActionId"
                type="button"
                class="icon-pill"
                [class.active]="action.active"
                [class.accent]="action.variant === 'accent'"
                [class.danger]="action.variant === 'danger'"
                [attr.data-label]="action.label"
                [attr.aria-label]="action.label"
                (click)="handleAction(action.id)"
              >
                <span class="icon-pill-emoji">{{ action.icon }}</span>
              </button>
            </div>
          </ng-template>
        </ng-container>

        <ng-template #rightEmptyState>
          <div class="desktop-spacer"></div>
        </ng-template>
      </div>
    </div>
  </nav>

  <nav
    class="mobile-bottom-nav"
    *ngIf="shouldShowBottomMobileNavbar()"
    [class.mobile-bottom-nav-profile]="isProfileNavbar()"
  >
    <ng-container *ngIf="isProfileNavbar(); else defaultMobileActions">
      <button
        *ngFor="let action of getProfileMobileStartActions(); trackBy: trackByActionId"
        type="button"
        class="mobile-tab"
        [class.active]="action.active"
        [class.accent]="action.variant === 'accent'"
        [class.danger]="action.variant === 'danger'"
        [attr.aria-label]="action.label"
        [attr.data-label]="action.label"
        (click)="handleAction(action.id)"
      >
        <span class="mobile-tab-icon">{{ action.icon }}</span>
        <span class="mobile-tab-label">{{ action.label }}</span>
      </button>

      <button
        type="button"
        class="mobile-tab active accent mobile-tab-profile"
        aria-label="Profilo"
        data-label="Profilo"
        (click)="handleAction('profilo')"
      >
        <span class="mobile-tab-icon">👤</span>
        <span class="mobile-tab-label">Profilo</span>
      </button>

      <button
        *ngFor="let action of getProfileMobileEndActions(); trackBy: trackByActionId"
        type="button"
        class="mobile-tab"
        [class.active]="action.active"
        [class.accent]="action.variant === 'accent'"
        [class.danger]="action.variant === 'danger'"
        [attr.aria-label]="action.label"
        [attr.data-label]="action.label"
        (click)="handleAction(action.id)"
      >
        <span class="mobile-tab-icon">{{ action.icon }}</span>
        <span class="mobile-tab-label">{{ action.label }}</span>
      </button>
    </ng-container>

    <ng-template #defaultMobileActions>
      <button
        *ngFor="let action of getMobileActions(); trackBy: trackByActionId"
        type="button"
        class="mobile-tab"
        [class.active]="action.active"
        [class.accent]="action.variant === 'accent'"
        [class.danger]="action.variant === 'danger'"
        [attr.aria-label]="action.label"
        [attr.data-label]="action.label"
        (click)="handleAction(action.id)"
      >
        <span class="mobile-tab-icon">{{ action.icon }}</span>
        <span class="mobile-tab-label">{{ action.label }}</span>
      </button>
    </ng-template>
  </nav>
</div>
