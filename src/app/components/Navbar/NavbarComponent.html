<nav class="navbar">
  <div class="nav-container">
    <div class="logo" (click)="vaiHome()">🏎️ ARENA<span>AUTO</span></div>

    <ul class="nav-menu">
      <li>
        <a routerLink="/Home" routerLinkActive="active">Catalogo</a>
      </li>

      <li *ngIf="loggedIn">
        <a routerLink="/Preferiti" routerLinkActive="active">❤️ Preferiti</a>
      </li>

      <li *ngIf="loggedIn">
        <a routerLink="/Profilo" routerLinkActive="active">👤 Profilo</a>
      </li>

      <li *ngIf="loggedIn && isAdmin()">
        <a routerLink="/Admin" routerLinkActive="active" class="admin-link">🛠️ Admin Panel</a>
      </li>
    </ul>

    <div class="nav-auth">
      <ng-container *ngIf="!loggedIn">
        <button class="btn-login" (click)="vaiLogin()">Accedi</button>
        <button class="btn-register" (click)="vaiRegistrazione()">Registrati</button>
      </ng-container>

      <div class="user-section" *ngIf="loggedIn">
        <span class="user-email" (click)="vaiProfilo()">Mio Profilo</span>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>
