<div class="navbar-shell">
  <div class="toast-notification" [class.active]="showToast" [ngClass]="toastType">
    <div class="toast-content">
      <i
        class="fas"
        [ngClass]="toastType === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'">
      </i>
      <span>{{ toastMsg }}</span>
    </div>
    <div class="toast-progress" [class.running]="showToast"></div>
  </div>

  <!-- NAVBAR DESKTOP -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <ng-container *ngIf="!isEmptyNavbar(); else leftEmptyState">
          <div class="desktop-toolbar desktop-toolbar-left">
            <button
              *ngFor="let action of getDesktopLeftActions(); trackBy: trackByActionId"
              type="button"
              class="icon-pill"
              [class.active]="action.active"
              [class.accent]="action.variant === 'accent'"
              [class.danger]="action.variant === 'danger'"
              [attr.data-label]="action.label"
              [attr.aria-label]="action.label"
              (click)="handleAction(action.id)"
            >
              <span class="icon-pill-emoji">{{ action.icon }}</span>
              <span *ngIf="action.sticker" class="action-sticker">{{ action.sticker }}</span>
            </button>
          </div>
        </ng-container>

        <ng-template #leftEmptyState>
          <div class="desktop-spacer"></div>
        </ng-template>
      </div>

      <a
        routerLink="/Home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="brand brand-center"
        title="Torna alla Home"
      >
        <img
          src="assets/img/SPECBATTLE.png"
          alt="SpecBattle - Logo"
          class="brand-logo"
        />

        <div class="brand-copy">
          <span class="brand-title">SPEC<span>BATTLE</span></span>
          <span class="brand-subtitle">compare • race • choose</span>
        </div>
      </a>

      <div class="nav-right">
        <ng-container *ngIf="!isEmptyNavbar(); else rightEmptyState">
          <div class="nav-auth" *ngIf="!loggedIn; else loggedToolbar">
            <div class="desktop-toolbar desktop-toolbar-right">
              <button
                *ngFor="let action of getDesktopRightActions(); trackBy: trackByActionId"
                type="button"
                class="icon-pill"
                [class.active]="action.active"
                [class.accent]="action.variant === 'accent'"
                [class.danger]="action.variant === 'danger'"
                [attr.data-label]="action.label"
                [attr.aria-label]="action.label"
                (click)="handleAction(action.id)"
              >
                <span class="icon-pill-emoji">{{ action.icon }}</span>
                <span *ngIf="action.sticker" class="action-sticker">{{ action.sticker }}</span>
              </button>

              <button type="button" class="btn-login" (click)="vaiLogin()">Accedi</button>
            </div>
          </div>

          <ng-template #loggedToolbar>
            <div class="desktop-toolbar desktop-toolbar-right">
              <button
                *ngFor="let action of getDesktopRightActions(); trackBy: trackByActionId"
                type="button"
                class="icon-pill"
                [class.active]="action.active"
                [class.accent]="action.variant === 'accent'"
                [class.danger]="action.variant === 'danger'"
                [attr.data-label]="action.label"
                [attr.aria-label]="action.label"
                (click)="handleAction(action.id)"
              >
                <span class="icon-pill-emoji">{{ action.icon }}</span>
                <span *ngIf="action.sticker" class="action-sticker">{{ action.sticker }}</span>
              </button>
            </div>
          </ng-template>
        </ng-container>

        <ng-template #rightEmptyState>
          <div class="desktop-spacer"></div>
        </ng-template>
      </div>
    </div>
  </nav>

  <!-- NAVBAR MOBILE -->
  <nav
    class="mobile-bottom-nav"
    *ngIf="shouldShowBottomMobileNavbar()"
    [class.mobile-bottom-nav-profile]="isProfileNavbar()"
  >
    <ng-container *ngIf="isProfileNavbar(); else defaultMobileActions">
      <div class="mobile-side-group">
        <button
          *ngFor="let action of getProfileMobileStartActions(); trackBy: trackByActionId"
          type="button"
          class="mobile-tab"
          [class.active]="action.active"
          [class.accent]="action.variant === 'accent'"
          [class.danger]="action.variant === 'danger'"
          [attr.aria-label]="action.label"
          [attr.data-label]="action.label"
          (click)="handleAction(action.id)"
        >
          <span class="mobile-tab-icon">{{ action.icon }}</span>
          <span class="mobile-tab-label">{{ action.label }}</span>
          <span *ngIf="action.sticker" class="action-sticker mobile-sticker">{{ action.sticker }}</span>
        </button>
      </div>

      <button
        type="button"
        class="mobile-tab mobile-tab-center active accent mobile-tab-profile"
        aria-label="Profilo"
        data-label="Profilo"
        (click)="handleAction('profilo')"
      >
        <span class="mobile-tab-icon">👤</span>
        <span class="mobile-tab-label">Profilo</span>
      </button>

      <div class="mobile-side-group">
        <button
          *ngFor="let action of getProfileMobileEndActions(); trackBy: trackByActionId"
          type="button"
          class="mobile-tab"
          [class.active]="action.active"
          [class.accent]="action.variant === 'accent'"
          [class.danger]="action.variant === 'danger'"
          [attr.aria-label]="action.label"
          [attr.data-label]="action.label"
          (click)="handleAction(action.id)"
        >
          <span class="mobile-tab-icon">{{ action.icon }}</span>
          <span class="mobile-tab-label">{{ action.label }}</span>
          <span *ngIf="action.sticker" class="action-sticker mobile-sticker">{{ action.sticker }}</span>
        </button>
      </div>
    </ng-container>

    <ng-template #defaultMobileActions>
      <ng-container *ngIf="getMobileActions().length === 5; else compactMobileActions">
        <div class="mobile-side-group">
          <button
            *ngFor="let action of getMobileActions() | slice:0:2; trackBy: trackByActionId"
            type="button"
            class="mobile-tab"
            [class.active]="action.active"
            [class.accent]="action.variant === 'accent'"
            [class.danger]="action.variant === 'danger'"
            [attr.aria-label]="action.label"
            [attr.data-label]="action.label"
            (click)="handleAction(action.id)"
          >
            <span class="mobile-tab-icon">{{ action.icon }}</span>
            <span class="mobile-tab-label">{{ action.label }}</span>
            <span *ngIf="action.sticker" class="action-sticker mobile-sticker">{{ action.sticker }}</span>
          </button>
        </div>

        <button
          type="button"
          class="mobile-tab mobile-tab-center"
          [class.active]="getMobileActions()[2].active"
          [class.accent]="getMobileActions()[2].variant === 'accent'"
          [class.danger]="getMobileActions()[2].variant === 'danger'"
          [attr.aria-label]="getMobileActions()[2].label"
          [attr.data-label]="getMobileActions()[2].label"
          (click)="handleAction(getMobileActions()[2].id)"
        >
          <span class="mobile-tab-icon">{{ getMobileActions()[2].icon }}</span>
          <span class="mobile-tab-label">{{ getMobileActions()[2].label }}</span>
          <span
            *ngIf="getMobileActions()[2].sticker"
            class="action-sticker mobile-sticker"
          >
            {{ getMobileActions()[2].sticker }}
          </span>
        </button>

        <div class="mobile-side-group">
          <button
            *ngFor="let action of getMobileActions() | slice:3:5; trackBy: trackByActionId"
            type="button"
            class="mobile-tab"
            [class.active]="action.active"
            [class.accent]="action.variant === 'accent'"
            [class.danger]="action.variant === 'danger'"
            [attr.aria-label]="action.label"
            [attr.data-label]="action.label"
            (click)="handleAction(action.id)"
          >
            <span class="mobile-tab-icon">{{ action.icon }}</span>
            <span class="mobile-tab-label">{{ action.label }}</span>
            <span *ngIf="action.sticker" class="action-sticker mobile-sticker">{{ action.sticker }}</span>
          </button>
        </div>
      </ng-container>

      <ng-template #compactMobileActions>
        <button
          *ngFor="let action of getMobileActions(); trackBy: trackByActionId"
          type="button"
          class="mobile-tab"
          [class.active]="action.active"
          [class.accent]="action.variant === 'accent'"
          [class.danger]="action.variant === 'danger'"
          [attr.aria-label]="action.label"
          [attr.data-label]="action.label"
          (click)="handleAction(action.id)"
        >
          <span class="mobile-tab-icon">{{ action.icon }}</span>
          <span class="mobile-tab-label">{{ action.label }}</span>
          <span *ngIf="action.sticker" class="action-sticker mobile-sticker">{{ action.sticker }}</span>
        </button>
      </ng-template>
    </ng-template>
  </nav>
</div>
