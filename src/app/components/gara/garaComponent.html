<div class="race-track">
  <div class="finish-line"></div>

  <div class="lane">
    <div class="car-wrapper"
         [class.moving]="animazioneIniziata"
         [class.winner]="score1 > score2">
      <img [src]="car1?.immagineUrl" class="car-sprite">
      <div class="car-info">
        <span class="car-name">{{car1?.marca}}</span>
        <span class="score-tag">{{score1}} PT</span>
      </div>
    </div>
  </div>

  <div class="vs-divider">VS</div>

  <div class="lane">
    <div class="car-wrapper"
         [class.moving]="animazioneIniziata"
         [class.winner]="score2 > score1">
      <img [src]="car2?.immagineUrl" class="car-sprite">
      <div class="car-info">
        <span class="car-name">{{car2?.marca}}</span>
        <span class="score-tag">{{score2}} PT</span>
      </div>
    </div>
  </div>
</div>

<div class="victory-banner" *ngIf="mostraVincitore">
  <h2 class="animate-winner">👑 VINCITORE: {{vincitoreNome}} 👑</h2>
</div>
