<div
  class="card-container"
  [class.selected-card]="isSelezionata"
  (click)="onCardClick()"
>
  <div class="image-wrapper">
    <img
      class="auto-image"
      [src]="immagineSrc"
      [alt]="auto.marca + ' ' + auto.modello"
      (error)="onImageError()"
    />
    <div class="card-overlay"></div>

    <div class="top-badge brand-highlight">
      {{ auto.marca }}
    </div>
  </div>

  <div class="auto-info">
    <h3 class="model">{{ auto.modello }}</h3>

    <div class="specs-preview">
      <span><i class="fas fa-horse-head"></i> {{ auto.cv }} CV</span>
      <span><i class="fas fa-tachometer-alt"></i> {{ auto.velocitaMax }} km/h</span>
    </div>
  </div>

  <div class="card-footer">
    <span class="price-tag">
      {{ auto.prezzo | currency:'EUR':'symbol':'1.2-2' }}
    </span>

    <button
      type="button"
      class="add-compare-btn"
      [class.active]="isSelezionata"
      (click)="onAggiungiAlConfronto($event)"
    >
      <i
        class="fas"
        [ngClass]="isSelezionata ? 'fa-check-circle' : 'fa-plus-circle'"
      ></i>
      {{ isSelezionata ? 'Selezionata' : 'Aggiungi al confronto' }}
    </button>
  </div>
</div>
