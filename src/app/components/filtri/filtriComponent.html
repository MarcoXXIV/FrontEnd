<div class="filter-card">
  <div class="filter-grid">

    <div class="filter-group">
      <label>Marca</label>
      <input type="text" [(ngModel)]="marca" placeholder="Es: Ferrari" (keyup.enter)="inviaFiltri()">
    </div>

    <div class="filter-group">
      <label>Modello</label>
      <input type="text" [(ngModel)]="modello" placeholder="Es: F8 Tributo" (keyup.enter)="inviaFiltri()">
    </div>

    <div class="filter-group">
      <button class="btn-reset" (click)="inviaFiltri()">🔍 Cerca Bolide</button>
    </div>

  </div>
</div>
