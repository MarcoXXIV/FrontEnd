<app-navbar></app-navbar>

<div
  class="notification-toast"
  *ngIf="notification.show"
  [ngClass]="notification.type"
>
  <div class="toast-icon">
    <i
      class="fas"
      [ngClass]="notification.type === 'success' ? 'fa-check-circle' : 'fa-times-circle'"
    ></i>
  </div>

  <div class="toast-content">
    <h4>{{ notification.title }}</h4>
    <p>{{ notification.message }}</p>
  </div>

  <button type="button" class="toast-close" (click)="closeNotification()">
    <i class="fas fa-times"></i>
  </button>
</div>

<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <i class="fas fa-car-side"></i>
      </div>
      <h1>Bentornato</h1>
      <p>Accedi per iniziare una nuova sfida!</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form" novalidate>
      <div class="input-group" [class.error]="fieldErrors.email">
        <label for="email">Email</label>

        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="credentials.email"
            (input)="onEmailInput()"
            (blur)="onEmailBlur()"
            placeholder="esempio@mail.com"
            autocomplete="email"
            required
          />
        </div>

        <small class="field-error" *ngIf="fieldErrors.email">
          {{ fieldErrors.email }}
        </small>

        <small class="field-hint" *ngIf="checkingEmail && !fieldErrors.email">
          Verifica email in corso...
        </small>
      </div>

      <div class="input-group" [class.error]="fieldErrors.password">
        <label for="password">Password</label>

        <div class="input-wrapper">
          <i class="fas fa-lock"></i>

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            (input)="onPasswordInput()"
            (blur)="validatePasswordField()"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />

          <i
            class="fas toggle-icon"
            [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            (click)="togglePassword()"
          ></i>
        </div>

        <small class="field-error" *ngIf="fieldErrors.password">
          {{ fieldErrors.password }}
        </small>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">
          Accedi al Garage
          <i class="fas fa-arrow-right"></i>
        </span>

        <div class="spinner" *ngIf="loading"></div>
      </button>
    </form>

    <div class="card-footer">
      <p>
        Nuovo nel circuito?
        <a (click)="goToRegister()">Crea un account</a>
      </p>
    </div>
  </div>
</div>
