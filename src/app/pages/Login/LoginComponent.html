<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <i class="fas fa-car-side"></i>
      </div>
      <h1>Bentornato</h1>
      <p>Accedi per iniziare una nuova sfida!</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
      <div class="input-group" [class.error]="errorMessage && !credentials.email">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="credentials.email"
            placeholder="esempio@mail.com"
            required>
        </div>
      </div>

      <div class="input-group" [class.error]="errorMessage && !credentials.password">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="••••••••"
            required>

          <i
            class="fas toggle-icon"
            [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
            (click)="togglePassword()">
          </i>
        </div>
      </div>

      <div class="error-banner" *ngIf="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Accedi al Garage <i class="fas fa-arrow-right"></i></span>
        <div class="spinner" *ngIf="loading"></div>
      </button>
    </form>

    <div class="card-footer">
      <p>Nuovo nel circuito? <a (click)="goToRegister()">Crea un account</a></p>

      <button type="button" class="btn-home-link" (click)="vaiHome()">
        <i class="fas fa-house"></i> Torna alla Home
      </button>
    </div>
  </div>
</div>
