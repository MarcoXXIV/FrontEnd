<div class="admin-container">
  <header class="admin-header">
    <h1><i class="fas fa-tools"></i> Pannello di Controllo</h1>
  </header>

  <div class="admin-content-wrapper">
    <nav class="admin-nav">
      <button [class.active]="sezioneAttiva === 'utenti'" (click)="setSezione('utenti')">👥 Gestione Utenti</button>
      <button [class.active]="sezioneAttiva === 'nuova-auto'" (click)="setSezione('nuova-auto')">➕ Aggiungi Nuova Auto</button>
    </nav>

    <main class="admin-main">
      <section *ngIf="sezioneAttiva === 'utenti'" class="fade-in">
        <h2>Utenti Registrati</h2>
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Azione</th></tr></thead>
          <tbody>
          <tr *ngFor="let u of listaUtenti">
            <td><strong>{{u.nome}}</strong></td>
            <td>{{u.email}}</td>
            <td><button class="btn-delete" (click)="eliminaUtente(u.id)">Elimina</button></td>
          </tr>
          </tbody>
        </table>
      </section>

      <section *ngIf="sezioneAttiva === 'nuova-auto'" class="fade-in">
        <h2>Nuovo Veicolo</h2>
        <form (ngSubmit)="aggiungiAuto()" class="auto-form">

          <div class="form-section">
            <h3>Dati di Base</h3>
            <div class="form-grid">
              <div class="form-group"><label>Marca</label><input type="text" [(ngModel)]="nuovaAuto.marca" name="marca"></div>
              <div class="form-group"><label>Modello</label><input type="text" [(ngModel)]="nuovaAuto.modello" name="modello"></div>
              <div class="form-group"><label>Anno</label><input type="number" [(ngModel)]="nuovaAuto.anno" name="anno"></div>
              <div class="form-group"><label>Prezzo (€)</label><input type="number" [(ngModel)]="nuovaAuto.prezzo" name="prezzo"></div>
              <div class="form-group"><label>Categoria</label><input type="text" [(ngModel)]="nuovaAuto.categoria" name="cat"></div>
              <div class="form-group"><label>Codice</label><input type="text" [(ngModel)]="nuovaAuto.codice" name="codice"></div>
            </div>
          </div>

          <div class="form-section">
            <h3>Motore e Meccanica</h3>
            <div class="form-grid">
              <div class="form-group"><label>Cavalli (CV)</label><input type="number" [(ngModel)]="nuovaAuto.cv" name="cv"></div>
              <div class="form-group"><label>Cilindrata</label><input type="number" [(ngModel)]="nuovaAuto.cilindrata" name="cili"></div>
              <div class="form-group"><label>Cilindri</label><input type="number" [(ngModel)]="nuovaAuto.cilindri" name="cilindri"></div>
              <div class="form-group"><label>Coppia (Nm)</label><input type="number" [(ngModel)]="nuovaAuto.coppia" name="coppia"></div>
              <div class="form-group"><label>Trazione</label><input type="text" [(ngModel)]="nuovaAuto.trazione" name="traz"></div>
              <div class="form-group"><label>Alimentazione</label><input type="text" [(ngModel)]="nuovaAuto.alimentazione" name="ali"></div>
            </div>
          </div>

          <div class="form-section">
            <h3>Performance</h3>
            <div class="form-grid">
              <div class="form-group"><label>Velocità Max</label><input type="number" [(ngModel)]="nuovaAuto.velocitaMax" name="vmax"></div>
              <div class="form-group"><label>0-100 km/h</label><input type="number" step="0.1" [(ngModel)]="nuovaAuto.accelerazione0100" name="a1"></div>
              <div class="form-group"><label>100-200 km/h</label><input type="number" step="0.1" [(ngModel)]="nuovaAuto.accelerazione100200" name="a2"></div>
              <div class="form-group"><label>Peso (Kg)</label><input type="number" [(ngModel)]="nuovaAuto.pesoKg" name="peso"></div>
              <div class="form-group"><label>Rapporto P/P</label><input type="number" step="0.01" [(ngModel)]="nuovaAuto.rapportoPesoPotenza" name="rpp"></div>
            </div>
          </div>

          <div class="form-section">
            <h3>Ecologia</h3>
            <div class="form-grid">
              <div class="form-group"><label>Euro</label><input type="text" [(ngModel)]="nuovaAuto.euro" name="euro"></div>
              <div class="form-group"><label>CO2</label><input type="number" [(ngModel)]="nuovaAuto.co2" name="co2"></div>
              <div class="form-group"><label>Consumo Medio</label><input type="number" step="0.1" [(ngModel)]="nuovaAuto.consumoMedio" name="cons"></div>
            </div>
          </div>

          <button type="submit" class="btn-save">🚀 Salva nel Database</button>
        </form>
      </section>
    </main>
  </div>
</div>
