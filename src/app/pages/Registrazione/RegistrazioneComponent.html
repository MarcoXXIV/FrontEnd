<div class="register-container">

  <div class="register-content-wrapper fade-in">

    <header class="admin-header-style">
      <div class="title-group">
        <h1><i class="fas fa-flag-checkered"></i> Pit Lane</h1>
        <p>Crea il tuo profilo pilota e scendi in pista</p>
      </div>

      <div class="header-actions">

        <button class="btn-home-green" (click)="vaiHome()">
          <i class="fas fa-house"></i> Home
        </button>
      </div>
    </header>

    <div class="register-card">

      <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="register-form">

        <div class="row">
          <div class="input-group">
            <label>Nome</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" name="nome" [(ngModel)]="user.nome" placeholder="Mario" required>
            </div>
          </div>

          <div class="input-group">
            <label>Cognome</label>
            <div class="input-wrapper">
              <i class="fas fa-user-tag"></i>
              <input type="text" name="cognome" [(ngModel)]="user.cognome" placeholder="Rossi" required>
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" [(ngModel)]="user.email" placeholder="mario.rossi@mail.it" required>
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="user.password" placeholder="••••••••" required>
            <i class="fas toggle-icon" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'" (click)="togglePassword()"></i>
          </div>
        </div>

        <div class="input-group">
          <label>Conferma Password</label>
          <div class="input-wrapper">
            <i class="fas fa-shield-alt"></i>
            <input [type]="showPassword ? 'text' : 'password'" name="conferma" [(ngModel)]="confermaPassword" placeholder="••••••••" required>
          </div>
        </div>

        <div class="error-banner" *ngIf="errorMessage">
          <i class="fas fa-exclamation-triangle"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="btn-register-glow" [disabled]="loading">
          <span *ngIf="!loading">UNISCITI AL TEAM <i class="fas fa-bolt"></i></span>
          <div class="spinner" *ngIf="loading"></div>
        </button>
      </form>

      <div class="card-footer">
        <p>Hai già un account? <a (click)="goToLogin()">Accedi qui</a></p>
      </div>
    </div>
  </div>
</div>
